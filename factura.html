<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factura PETSAFE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Libre+Barcode+128&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef3f7;
        --panel: #ffffff;
        --navy: #0f172a;
        --text: #1f2937;
        --muted: #64748b;
        --line: #dfe7ef;
        --shadow: rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      body {
        margin: 0;
        padding: 20px 16px 40px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .invoice-window {
        width: 100%;
        min-height: 100vh;
        background: linear-gradient(180deg, #eef3f7 0%, #f8fafc 100%);
        color: var(--text);
        overflow-x: hidden;
      }

      #invoice-root {
        width: min(760px, 100%);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .invoice-toolbar {
        width: min(760px, 100%);
        margin: 0 auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .secondary-btn,
      .ghost-btn,
      .primary-btn {
        appearance: none;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #fff;
        color: var(--navy);
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .secondary-btn:hover,
      .ghost-btn:hover,
      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(15, 23, 42, 0.08);
      }

      .invoice-sheet {
        width: min(760px, 100%);
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 12px 20px var(--shadow);
        padding: 22px 26px 24px;
        position: relative;
        overflow: hidden;
      }

      .invoice-header {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) 0.7fr minmax(0, 1fr);
        gap: 18px;
        border-bottom: 2px solid var(--navy);
        padding-bottom: 14px;
        margin-bottom: 18px;
        align-items: center;
      }

      .company-block {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(15, 23, 42, 0.04);
        color: var(--navy);
        flex-shrink: 0;
      }

      .brand-mark svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      .company-meta {
        min-width: 0;
      }

      .company-meta h2 {
        margin: 0;
        font-size: 0.96rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        line-height: 1.4;
      }

      .company-meta p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.5;
      }

      .invoice-code {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .invoice-code-box {
        width: 86px;
        height: 86px;
        border: 2px solid var(--navy);
        display: grid;
        place-items: center;
        border-radius: 6px;
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--navy);
        background: #fff;
      }

      .invoice-legal {
        text-align: right;
      }

      .invoice-legal-title {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .invoice-legal strong {
        display: block;
        font-size: 1.15rem;
        color: var(--navy);
      }

      .invoice-legal small {
        display: block;
        color: var(--muted);
        font-size: 0.74rem;
        line-height: 1.6;
      }

      .paid-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(21, 128, 61, 0.25);
        background: rgba(21, 128, 61, 0.08);
        color: #166534;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .customer-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px 14px;
        margin-bottom: 18px;
      }

      .field-box {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .field-box span {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field-box strong {
        font-size: 0.92rem;
        line-height: 1.5;
        word-break: break-word;
      }

      .invoice-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        border: 1px solid var(--line);
        table-layout: fixed;
      }

      .invoice-table th,
      .invoice-table td {
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 10px 8px;
        text-align: left;
        font-size: 0.8rem;
        line-height: 1.5;
        word-break: break-word;
        vertical-align: top;
      }

      .invoice-table th:last-child,
      .invoice-table td:last-child {
        border-right: none;
      }

      .invoice-table thead th {
        background: #f8fafc;
        color: var(--navy);
        font-weight: 800;
      }

      .fiscal-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      .fiscal-card {
        border: 1px solid var(--line);
        background: #f8fafc;
        border-radius: 6px;
        padding: 12px 14px;
      }

      .fiscal-card h4 {
        margin: 0 0 10px;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .talon {
        margin-top: 26px;
        border-top: 2px dashed #64748b;
        padding-top: 14px;
        width: 100%;
        text-align: center;
      }

      .talon-header {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 12px;
        font-weight: 800;
      }

      .talon-grid {
        display: grid;
        grid-template-columns: 1fr 1.1fr 1fr;
        gap: 14px;
      }

      .talon-box {
        border: 1px solid var(--line);
        background: #f8fafc;
        border-radius: 6px;
        padding: 10px 12px;
      }

      .talon-box h5 {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .barcode-box {
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        padding: 8px 12px;
        margin-top: 16px;
        text-align: center;
      }

      .barcode {
        display: block;
        width: 100%;
        height: 52px;
        margin: 8px auto;
        font-family: 'Libre Barcode 128', 'JetBrains Mono', monospace;
        font-size: clamp(42px, 5vw, 76px);
        line-height: 1;
        overflow: hidden;
        white-space: nowrap;
        letter-spacing: 1px;
      }

      .barcode-number {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.03em;
        color: var(--navy);
        display: block;
        margin-top: 6px;
      }

      @media (max-width: 820px) {
        .invoice-header,
        .customer-strip,
        .fiscal-grid,
        .talon-grid {
          grid-template-columns: 1fr;
        }

        .invoice-legal {
          text-align: left;
        }

        .invoice-legal-title {
          justify-content: flex-start;
        }
      }

      @media (max-width: 560px) {
        body {
          padding-left: 10px;
          padding-right: 10px;
        }

        .invoice-toolbar {
          justify-content: stretch;
        }

        .secondary-btn,
        .ghost-btn,
        .primary-btn {
          flex: 1 1 100%;
          width: 100%;
        }

        .invoice-sheet {
          padding: 16px 14px 18px;
        }

        .company-block {
          align-items: flex-start;
        }

        .company-meta h2 {
          font-size: 0.82rem;
        }

        .invoice-code-box {
          width: 68px;
          height: 68px;
          font-size: 1.7rem;
        }

        .invoice-table th,
        .invoice-table td {
          font-size: 0.72rem;
          padding: 8px 6px;
        }
      }

      @media print {
        .no-print {
          display: none !important;
        }

        body {
          background: white;
          padding: 0;
        }

        .invoice-sheet {
          border: none;
          box-shadow: none;
          border-radius: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body class="invoice-window">
    <div id="invoice-root"></div>

    <script>
      const DB_KEY = 'petsafe_db';

      function readDb() {
        try {
          const raw = localStorage.getItem(DB_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          console.error('Error leyendo la base de datos:', error);
          return null;
        }
      }

      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || params.get(name.toLowerCase()) || null;
      }

      function normalizeInvoice(raw = {}, fallbackUser = {}) {
        const invoice = { ...raw };
        const normalized = {
          ...invoice,
          id: invoice.id || invoice.numero || `fac-${Date.now()}-${Math.random().toString(16).slice(2, 6)}`,
          numero: invoice.numero || invoice.id || 'FC-C 0004-00000000',
          concepto: invoice.concepto || `Cobertura ${invoice.plan || fallbackUser.plan || 'Plan'} - Póliza #${fallbackUser.poliza || 'PET-2026001'}`,
          periodo: invoice.periodo || invoice.mes || invoice.fechaEmision || 'Sin período',
          vencimiento: invoice.vencimiento || invoice.fecha_vencimiento || 'Sin vencimiento',
          importe: Number(invoice.importe ?? invoice.monto ?? 0),
          estado: invoice.estado || 'pendiente',
          cae: invoice.cae || invoice.CAE || '74429183920194',
          barCode: invoice.barCode || invoice.bar_code || invoice.barcode || invoice.codigoBarra || '',
          codigoPago: invoice.codigoPago || invoice.codigo_pago || invoice.codigo || '',
          fechaEmision: invoice.fechaEmision || invoice.fecha_emision || invoice.fecha || '',
          fechaAcreditacion: invoice.fechaAcreditacion || invoice.fecha_acreditacion || '',
          titular: invoice.titular || fallbackUser.nombre || 'Titular',
          mascota: invoice.mascota || (Array.isArray(fallbackUser.mascotas) ? fallbackUser.mascotas[0]?.nombre : '') || 'Mascota no registrada',
          plan: invoice.plan || fallbackUser.plan || 'Plan',
          tipo: invoice.tipo || 'Rapipago / Pago Fácil',
          usuario_id: invoice.usuario_id || invoice.usuarioId || fallbackUser.id || null,
          documento: invoice.documento || fallbackUser.dni || 'CUIL 20-12345678-9'
        };

        if (!normalized.barCode && normalized.codigoPago) {
          normalized.barCode = `${normalized.codigoPago}${String(normalized.importe || 0).padStart(6, '0')}`;
        }

        return normalized;
      }

      function formatMoney(value) {
        return new Intl.NumberFormat('es-AR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(Number(value || 0));
      }

      function getBrandSvg() {
        return `
          <div class="brand-mark">
            <svg viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 5 52 13v15c0 12.7-7.7 24.6-20 31-12.3-6.4-20-18.3-20-31V13L32 5Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
              <path d="M22 28h20v8H22zm-4 12h28v6H18zm10-22h8v10h-8z" fill="currentColor"/>
            </svg>
          </div>
        `;
      }

      function pickInvoiceFromCollection(collection, invoiceId, userId) {
        if (!Array.isArray(collection)) return null;

        return collection.find((item) => {
          const normalizedItem = normalizeInvoice(item, {});
          const matchesId = normalizedItem.id === invoiceId || normalizedItem.numero === invoiceId || normalizedItem.codigoPago === invoiceId;
          const matchesUser = !userId || String(normalizedItem.usuario_id || '') === String(userId) || String(normalizedItem.usuarioId || '') === String(userId);
          return matchesId && matchesUser;
        }) || null;
      }

      async function resolveInvoice(userId, invoiceId) {
        const db = readDb();

        if (db?.users && Array.isArray(db.users)) {
          const user = db.users.find((item) => String(item.id) === String(userId) || String(item.usuario_id) === String(userId));
          const localInvoice = pickInvoiceFromCollection(user?.facturas || db.users.flatMap((entry) => entry.facturas || []), invoiceId, userId);

          if (localInvoice) {
            return { user: user || { id: userId, nombre: localInvoice.titular || 'Titular', plan: localInvoice.plan || 'Plan', poliza: 'PET-2026001' }, invoice: normalizeInvoice(localInvoice, user || {}) };
          }
        }

        if (Array.isArray(db?.facturas)) {
          const invoice = pickInvoiceFromCollection(db.facturas, invoiceId, userId);
          if (invoice) {
            const user = db.users?.find((item) => String(item.id) === String(userId) || String(item.usuario_id) === String(userId)) || { id: userId, nombre: invoice.titular || 'Titular', plan: invoice.plan || 'Plan', poliza: 'PET-2026001' };
            return { user, invoice: normalizeInvoice(invoice, user) };
          }
        }

        try {
          const response = await fetch(`/api/facturas?userId=${encodeURIComponent(userId)}`);
          if (!response.ok) {
            throw new Error('Factura no disponible');
          }

          const payload = await response.json();
          const facturas = Array.isArray(payload.facturas) ? payload.facturas : [];
          const invoice = pickInvoiceFromCollection(facturas, invoiceId, userId);

          if (invoice) {
            const user = (db?.users || []).find((item) => String(item.id) === String(userId) || String(item.usuario_id) === String(userId)) || {
              id: userId,
              nombre: invoice.titular || 'Titular',
              plan: invoice.plan || 'Plan',
              poliza: 'PET-2026001',
              dni: invoice.documento || 'CUIL 20-12345678-9'
            };
            return { user, invoice: normalizeInvoice(invoice, user) };
          }
        } catch (error) {
          console.warn('No se pudo resolver la factura desde la API:', error);
        }

        return null;
      }

      async function renderInvoice() {
        const root = document.getElementById('invoice-root');
        const invoiceId = getQueryParam('id') || getQueryParam('invoiceId');
        const userId = getQueryParam('userId') || getQueryParam('usuario_id') || getQueryParam('uid');

        if (!userId || !invoiceId) {
          root.innerHTML = '<div class="invoice-sheet"><h2>Factura no disponible</h2><p>Faltan los parámetros id y userId en la URL.</p></div>';
          return;
        }

        const resolved = await resolveInvoice(userId, invoiceId);

        if (!resolved) {
          root.innerHTML = '<div class="invoice-sheet"><h2>Factura no disponible</h2><p>No se encontró la boleta solicitada.</p></div>';
          return;
        }

        const { user, invoice } = resolved;
        const isPaid = invoice.estado === 'pagada';
        const docLabel = invoice.documento || user.dni || 'CUIL 20-12345678-9';
        const total = Number(invoice.importe || 0);

        root.innerHTML = `
          <div class="invoice-toolbar no-print">
            <button type="button" class="secondary-btn" id="printBtn">Imprimir / Guardar PDF</button>
            <button type="button" class="ghost-btn" id="closeBtn">Cerrar</button>
          </div>

          <div class="invoice-sheet" style="position: relative;">
            <div class="invoice-header">
              <div class="company-block">
                ${getBrandSvg()}
                <div class="company-meta">
                  <h2>PETSAFE | Grupo Asegurador</h2>
                  <p>
                    Av. Córdoba 1560, Piso 9<br />
                    CABA · CUIT 30-71465891-0<br />
                    www.petsafe.com.ar
                  </p>
                </div>
              </div>

              <div class="invoice-code">
                <div class="invoice-code-box">FC</div>
              </div>

              <div class="invoice-legal">
                <div class="invoice-legal-title">
                  <strong>Factura C</strong>
                  ${isPaid ? '<span class="paid-badge">Pagada</span>' : ''}
                </div>
                <small>
                  ${invoice.numero || 'FC-C 0004-00018492'}<br />
                  Fecha de emisión: ${invoice.fechaEmision || 'Sin fecha'}<br />
                  CAE: ${invoice.cae || '74429183920196'}
                </small>
              </div>
            </div>

            <div class="customer-strip">
              <div class="field-box">
                <span>Cliente</span>
                <strong>${invoice.titular || user.nombre || 'Titular'}</strong>
              </div>
              <div class="field-box">
                <span>Documento</span>
                <strong>${docLabel}</strong>
              </div>
              <div class="field-box">
                <span>Póliza</span>
                <strong>${user.poliza || 'PET-2026001'}</strong>
              </div>
              <div class="field-box">
                <span>Plan</span>
                <strong>${invoice.plan || user.plan || 'Plan'}</strong>
              </div>
            </div>

            <table class="invoice-table">
              <thead>
                <tr>
                  <th>Concepto</th>
                  <th>Período</th>
                  <th>Vencimiento</th>
                  <th>Importe</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${invoice.concepto || 'Cobertura mensual'}</td>
                  <td>${invoice.periodo || 'Sin período'}</td>
                  <td>${invoice.vencimiento || 'Sin vencimiento'}</td>
                  <td>$ ${formatMoney(total)}</td>
                </tr>
              </tbody>
            </table>

            <div class="fiscal-grid">
              <div class="fiscal-card">
                <h4>Detalle fiscal</h4>
                <div class="field-box">
                  <span>Moneda</span>
                  <strong>ARS</strong>
                </div>
                <div class="field-box" style="margin-top: 8px;">
                  <span>Forma de pago</span>
                  <strong>${invoice.tipo || 'Rapipago / Pago Fácil'}</strong>
                </div>
                <div class="field-box" style="margin-top: 8px;">
                  <span>CAE</span>
                  <strong>${invoice.cae || '74429183920196'}</strong>
                </div>
              </div>

              <div class="fiscal-card">
                <h4>Totales</h4>
                <div class="field-box">
                  <span>Subtotal</span>
                  <strong>$ ${formatMoney(total)}</strong>
                </div>
                <div class="field-box" style="margin-top: 8px;">
                  <span>Total</span>
                  <strong>$ ${formatMoney(total)}</strong>
                </div>
              </div>
            </div>

            <div class="talon">
              <div class="talon-header">Cupón de pago</div>

              <div class="talon-grid">
                <div class="talon-box">
                  <h5>Vencimiento</h5>
                  <strong>${invoice.vencimiento || 'Sin vencimiento'}</strong>
                </div>
                <div class="talon-box">
                  <h5>Importe</h5>
                  <strong>$ ${formatMoney(total)}</strong>
                </div>
                <div class="talon-box">
                  <h5>Comprobante</h5>
                  <strong>${invoice.numero || 'FC-C 0004-00018492'}</strong>
                </div>
              </div>

              <div class="barcode-box" style="margin-top: 16px;">
                <span class="barcode">${invoice.barCode || '0004000184922026101000450000071589421984210000184927'}</span>
                <span class="barcode-number">${invoice.codigoPago || invoice.barCode || '000400018492'}</span>
              </div>
            </div>
          </div>
        `;

        const printBtn = document.getElementById('printBtn');
        const closeBtn = document.getElementById('closeBtn');

        if (printBtn) {
          printBtn.addEventListener('click', () => window.print());
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', () => window.close());
        }
      }

      document.addEventListener('DOMContentLoaded', renderInvoice);
    </script>
  </body>
</html>
